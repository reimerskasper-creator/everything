<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111a"><meta name="description" content="Track anything. Your life, your numbers, your rules."><link rel="manifest" href="manifest.webmanifest"><title>EVERYTHING. — Track anything</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b111a;color:#f1f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #76e7c4;outline-offset:2px}.shell{max-width:1000px;margin:auto;padding:24px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:32px}.brand{font-size:25px;letter-spacing:-1.4px;font-weight:900}.brand span{color:#79e9c5}.sub{color:#8795a9;font-size:12px;margin-top:3px}.eyebrow{font-size:11px;font-weight:800;color:#80e8c6;letter-spacing:2px;text-transform:uppercase}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 24px}.hero h1{font-size:clamp(29px,5vw,43px);line-height:1.08;letter-spacing:-1.7px;margin:9px 0 7px}.muted{color:#8998ac}.btn{border:1px solid #29384c;background:#182333;color:#eaf2fa;border-radius:13px;padding:11px 15px;font-weight:700}.btn:hover{background:#26364a}.btn.primary{background:#79e9c5;color:#071913;border-color:#79e9c5}.btn.primary:hover{background:#9cf2d6}.btn.small{padding:7px 10px;font-size:12px}.btn.icon{min-width:42px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{background:linear-gradient(145deg,#182331,#121c29);border:1px solid #293647;border-radius:20px;padding:19px;min-height:205px;display:flex;flex-direction:column;gap:10px}.tileTop{display:flex;justify-content:space-between;align-items:center}.emoji{font-size:25px;display:inline-grid;place-items:center;background:#253547;border-radius:12px;width:43px;height:43px}.type{font-size:11px;color:#94a5ba;text-transform:uppercase;letter-spacing:.8px}.name{font-size:15px;font-weight:700}.value{font-size:29px;font-weight:850;letter-spacing:-1px;overflow-wrap:anywhere}.meta{font-size:12px;color:#9caabc}.bar{height:7px;border-radius:20px;background:#2c3949;overflow:hidden}.bar>i{display:block;height:100%;background:#78e6c2;border-radius:20px}.tileActions{margin-top:auto;display:flex;gap:8px}.tileActions button{flex:1;border-radius:10px;padding:9px 6px;border:1px solid #334356;background:#243244;color:#eaf5fa;font-weight:750}.tileActions .add{background:#234b43;color:#a8f8d9;border-color:#315f53}.empty{border:1px dashed #36465a;border-radius:20px;padding:50px 25px;text-align:center;color:#98a6b8}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101925ed;border-top:1px solid #2a3749;backdrop-filter:blur(15px);display:flex;justify-content:center;gap:6px;padding:11px 12px calc(11px + env(safe-area-inset-bottom))}.bottom button{width:130px;background:none;border:0;border-radius:12px;padding:9px;color:#91a2b5;font-weight:700}.bottom button.active{color:#8becc9;background:#223b39}.panel{background:#152131;border:1px solid #2b3b4f;border-radius:18px;padding:20px;margin:15px 0}.panel h2{margin:0 0 16px;font-size:20px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;flex:1;min-width:150px}.field label{color:#a5b3c5;font-size:12px;font-weight:700}.field input,.field select{background:#0e1926;color:#f2f6fa;border:1px solid #34475a;border-radius:11px;padding:12px;width:100%;min-height:45px}.field input[type=checkbox]{width:auto;min-height:0}.field.checkbox{flex-direction:row;align-items:center}.field.checkbox label{font-size:14px}.hide{display:none!important}.historyItem{border-bottom:1px solid #2b3a4d;padding:13px 0;display:flex;justify-content:space-between;gap:10px}.historyItem:last-child{border:0}.tiny{font-size:11px}.notice{font-size:13px;color:#a8b8cb;line-height:1.6}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#24574b;border:1px solid #4d9c83;border-radius:12px;z-index:20;box-shadow:0 8px 35px #0008}.danger{color:#ffaaaa}.detailHead{display:flex;gap:14px;align-items:center;margin-bottom:15px}.detailHead h2{margin:0}.bigValue{font-size:45px;letter-spacing:-1.5px;font-weight:850;margin:15px 0}.sectionTitle{font-size:17px;margin:25px 0 12px}.chip{border:1px solid #33475a;border-radius:9px;padding:6px 9px;color:#a8b7c7;font-size:12px}.filters{display:flex;gap:8px;overflow-x:auto;margin:15px 0 21px}.filters button{border:1px solid #2b3d50;border-radius:30px;background:#172536;color:#acb9c9;padding:8px 13px;white-space:nowrap}.filters button.active{background:#274a44;border-color:#5baf92;color:#9af2d2}.hint{font-size:12px;color:#8f9fb3;margin-top:4px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:21px 15px 115px}.tile{padding:15px;min-height:200px}.value{font-size:25px}}@media(max-width:450px){.grid{gap:10px}.tile{padding:13px;min-height:193px;border-radius:17px}.name{font-size:13px}.value{font-size:23px}.emoji{width:38px;height:38px;font-size:22px}.tileActions button{padding:9px 4px}.hero h1{font-size:30px}.btn.primary.topadd{font-size:12px;padding:11px}.brand{font-size:22px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">EVERYTHING<span>.</span></div><div class="sub">Your life. Your numbers. Your rules.</div></div><button class="btn primary topadd" id="newTop">＋ New tracker</button></header><main id="app"></main></div><nav class="bottom"><button data-nav="home" class="active">▦ Dashboard</button><button data-nav="activity">◷ Activity</button><button data-nav="settings">⚙ Settings</button></nav><script>
(()=>{'use strict';const KEY='everything-tracker-v1';const $=s=>document.querySelector(s);const app=$('#app');const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,u)=>u==='$'?'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2}):Number(n).toLocaleString(undefined,{maximumFractionDigits:2})+(u?' '+safe(u):'');const today=()=>new Date().toISOString().slice(0,10);const TYPES={counter:'Counter',amount:'Amount',distance:'Distance',timer:'Time total',countdown:'Countdown',habit:'Habit'};let state={trackers:[],events:[],rules:[]},page='home',selected=null,filter='all',editId=null;try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&Array.isArray(stored.trackers)&&Array.isArray(stored.events)){state={trackers:stored.trackers,events:stored.events,rules:Array.isArray(stored.rules)?stored.rules:[]}}}catch(e){alert('Saved data could not be read. Do not clear site data; restore a backup if available.')}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Storage full or unavailable. Export a backup now.');return false}}const get=i=>state.trackers.find(t=>t.id===i);function notify(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2100)}function entries(t){return state.events.filter(e=>e.trackerId===t.id)}function total(t){if(t.type==='countdown')return Math.max(0,Math.ceil((new Date(t.date+'T00:00:00')-new Date())/86400000));if(t.type==='habit')return entries(t).filter(e=>e.amount>0).length;return entries(t).reduce((a,e)=>a+Number(e.amount||0),Number(t.start||0))}function format(t,v){if(t.type==='countdown')return v+' days';if(t.type==='habit')return v+' days';return money(v,t.unit)}function percent(t){if(!t.goal||t.type==='countdown')return 0;return Math.max(0,Math.min(100,total(t)/Number(t.goal)*100))}function go(p){page=p;selected=null;editId=null;render()}function showDetail(i){selected=i;page='detail';render()}function card(t){const v=total(t),goal=t.goal>0?`of ${format(t,Number(t.goal))}`:t.type==='countdown'?`Until ${safe(t.date||'—')}`:'All time';return `<article class="tile"><div class="tileTop"><span class="emoji">${safe(t.icon||'📌')}</span><span class="type">${safe(TYPES[t.type]||'Tracker')}</span></div><div class="name">${safe(t.name)}</div><div class="value">${format(t,v)}</div><div class="meta">${goal}</div>${t.goal>0&&t.type!=='countdown'?`<div class="bar"><i style="width:${percent(t)}%"></i></div>`:''}<div class="tileActions">${t.type!=='countdown'?`<button data-do="subtract" data-id="${t.id}">−</button><button class="add" data-do="add" data-id="${t.id}">+ ${t.type==='habit'?'1':safe(t.step||1)}</button>`:''}<button data-do="detail" data-id="${t.id}">Details →</button></div></article>`}function home(){const items=state.trackers.filter(t=>filter==='all'||t.type===filter);app.innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR DASHBOARD</div><h1>Track what matters.</h1><div class="muted">${state.trackers.length} trackers · All yours</div></div></div><div class="filters">${[['all','All'],...Object.entries(TYPES)].map(([k,v])=>`<button class="${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('')}</div>${items.length?`<div class="grid">${items.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:34px">✨</div><h2>${state.trackers.length?'No trackers in this category':'Start tracking anything.'}</h2><p>Build a counter, savings goal, countdown, distance tracker or habit in seconds.</p><button class="btn primary" data-do="create">＋ Create tracker</button></div>`}`}function form(){const t=editId?get(editId):null;app.innerHTML=`<button class="btn small" data-do="back">← Back</button><h1>${t?'Edit tracker':'Create a tracker'}</h1><div class="panel"><form id="trackerForm"><div class="row"><div class="field"><label>Name</label><input name="name" maxlength="55" required placeholder="e.g. Push-ups" value="${safe(t?.name||'')}"></div><div class="field" style="max-width:100px"><label>Icon (emoji)</label><input name="icon" maxlength="8" value="${safe(t?.icon||'🎯')}"></div></div><div class="row"><div class="field"><label>Tracker type</label><select name="type" id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${t?.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field" id="unitField"><label>Unit</label><input name="unit" maxlength="15" placeholder="reps, $, miles, hours" value="${safe(t?.unit??'reps')}"></div></div><div class="row" id="numberFields"><div class="field"><label>Goal (optional)</label><input name="goal" type="number" min="0" step="any" placeholder="100" value="${t?.goal??''}"></div><div class="field"><label>Quick-add amount</label><input name="step" type="number" min="0.000001" step="any" value="${t?.step??1}"></div></div><div class="field ${t?.type==='countdown'?'':'hide'}" id="dateField"><label>Target date</label><input name="date" type="date" value="${safe(t?.date||today())}"></div>${t?'':`<div class="field" id="startField"><label>Starting amount (optional)</label><input name="start" type="number" step="any" value="0"></div>`}<p class="notice">You can change these settings later. Every log entry is timestamped and kept in your history.</p><button class="btn primary" type="submit">${t?'Save changes':'Create tracker'}</button></form></div>`;updateType()}function updateType(){const type=$('#type')?.value;if(!type)return;$('#dateField').classList.toggle('hide',type!=='countdown');$('#unitField').classList.toggle('hide',type==='countdown'||type==='habit');$('#numberFields').classList.toggle('hide',type==='countdown'||type==='habit');$('#startField')?.classList.toggle('hide',type==='countdown'||type==='habit');if(type==='amount'&&$('#trackerForm [name=unit]').value==='reps')$('#trackerForm [name=unit]').value='$';if(type==='distance'&&$('#trackerForm [name=unit]').value==='reps')$('#trackerForm [name=unit]').value='miles';if(type==='timer'&&$('#trackerForm [name=unit]').value==='reps')$('#trackerForm [name=unit]').value='min'}function detail(){const t=get(selected);if(!t)return go('home');const v=total(t),es=entries(t).slice().reverse();app.innerHTML=`<button class="btn small" data-do="back">← Dashboard</button><div class="panel"><div class="row between"><div class="detailHead"><span class="emoji">${safe(t.icon)}</span><div><h2>${safe(t.name)}</h2><div class="muted tiny">${safe(TYPES[t.type])}</div></div></div><button class="btn small" data-do="edit" data-id="${t.id}">✎ Edit</button></div><div class="bigValue">${format(t,v)}</div>${t.goal>0?`<div class="meta">${Math.round(percent(t))}% of ${format(t,t.goal)} goal</div><div class="bar" style="margin:12px 0"><i style="width:${percent(t)}%"></i></div>`:''}${t.type!=='countdown'?`<div class="row" style="margin-top:20px"><button class="btn" data-do="subtract" data-id="${t.id}">− ${t.step||1}</button><button class="btn primary" data-do="add" data-id="${t.id}">＋ ${t.type==='habit'?'Mark today':t.step||1}</button><button class="btn" data-do="custom" data-id="${t.id}">Custom amount</button></div>`:''}</div><h3 class="sectionTitle">History</h3><div class="panel">${es.length?es.slice(0,100).map(e=>`<div class="historyItem"><div><b>${e.amount>=0?'+':''}${format(t,e.amount)}</b><div class="muted tiny">${new Date(e.at).toLocaleString()}</div></div><button class="btn small" data-do="undo" data-id="${e.id}">Delete</button></div>`).join(''):'<div class="muted">No entries yet.</div>'}</div><button class="btn danger" data-do="deleteTracker" data-id="${t.id}">Delete tracker and history</button>`}function activity(){const ev=state.events.slice().reverse();app.innerHTML=`<div class="eyebrow">YOUR JOURNAL</div><h1>Activity</h1><p class="muted">Every change, in one place.</p><div class="panel">${ev.length?ev.slice(0,150).map(e=>{const t=get(e.trackerId);return `<div class="historyItem"><div><b>${safe(t?.icon||'📌')} ${safe(t?.name||'Deleted tracker')}</b><div class="muted tiny">${new Date(e.at).toLocaleString()}</div></div><b>${e.amount>=0?'+':''}${t?format(t,e.amount):e.amount}</b></div>`}).join(''):'<p class="muted">Your logged activity will appear here.</p>'}</div>`}function settings(){app.innerHTML=`<div class="eyebrow">CONTROL CENTER</div><h1>Settings & backups</h1><div class="panel"><h2>Your data stays yours</h2><p class="notice">Everything is saved on this device in this browser. No account, no server, no cloud sync. Clearing browser/site data or changing devices can erase it. Export backups regularly.</p><div class="row"><button class="btn primary" data-do="export">↓ Export backup</button><label class="btn" style="cursor:pointer">↑ Restore backup<input id="import" type="file" accept=".json,application/json" hidden></label></div></div><div class="panel"><h2>Connected trackers</h2><p class="notice">Create a simple rule: when you add to one tracker, automatically add or subtract a matching amount from another. One-way connections only; no circular chains.</p>${state.rules.map(r=>{const a=get(r.from),b=get(r.to);return `<div class="historyItem"><span>${safe(a?.name||'?')} → ${r.multiplier<0?'subtract from':'add to'} ${safe(b?.name||'?')} (${r.multiplier<0?'−':'+'}${Math.abs(r.multiplier)}×)</span><button class="btn small" data-do="deleteRule" data-id="${r.id}">Remove</button></div>`}).join('')}<form id="ruleForm"><div class="row"><div class="field"><label>When adding to</label><select name="from" required>${state.trackers.filter(t=>t.type!=='countdown').map(t=>`<option value="${t.id}">${safe(t.name)}</option>`).join('')}</select></div><div class="field"><label>Also change</label><select name="to" required>${state.trackers.filter(t=>t.type!=='countdown').map(t=>`<option value="${t.id}">${safe(t.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Direction</label><select name="sign"><option value="1">Add</option><option value="-1">Subtract</option></select></div><div class="field"><label>Multiplier</label><input type="number" name="multiplier" value="1" step="any" min="0.000001" required></div></div><button class="btn" ${state.trackers.length<2?'disabled':''}>＋ Add connection</button></form></div><div class="panel"><h2>About EVERYTHING.</h2><p class="notice">Version 1 · Installable web app · Offline after first load · Manual backups. Home-screen Android widgets, automatic device syncing, and reminders are not included in this version.</p></div>`}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));if(page==='home')home();else if(page==='create')form();else if(page==='detail')detail();else if(page==='activity')activity();else settings()}function log(i,amount,propagate=true){const t=get(i);if(!t||!Number.isFinite(amount))return;if(t.type==='habit'&&amount>0&&entries(t).some(e=>e.amount>0&&e.at.slice(0,10)===today())){notify('Already marked today');return}state.events.push({id:id(),trackerId:i,amount,at:new Date().toISOString()});if(propagate&&amount>0){state.rules.filter(r=>r.from===i).forEach(r=>{const target=get(r.to);if(target)state.events.push({id:id(),trackerId:r.to,amount:amount*r.multiplier,at:new Date().toISOString(),linkedFrom:i})})}save();render()}function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='everything-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function importData(file){if(!file)return;try{if(file.size>10000000)throw Error('File too large');const d=JSON.parse(await file.text());if(!Array.isArray(d.trackers)||!Array.isArray(d.events)||!Array.isArray(d.rules))throw Error('Invalid backup');if(!confirm('Replace ALL current trackers and history with this backup?'))return;state={trackers:d.trackers,events:d.events,rules:d.rules};save();go('home');notify('Backup restored')}catch(e){alert('Restore failed: '+e.message)}}document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});$('#newTop').addEventListener('click',()=>{page='create';render()});app.addEventListener('change',e=>{if(e.target.id==='type')updateType();if(e.target.id==='import')importData(e.target.files[0])});app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='trackerForm'){const f=new FormData(e.target),type=f.get('type'),name=String(f.get('name')).trim(),goal=Number(f.get('goal'))||0,step=Number(f.get('step'))||1;if(!name)return;const t={id:editId||id(),name,icon:String(f.get('icon')||'🎯'),type,unit:String(f.get('unit')||''),goal:type==='habit'||type==='countdown'?0:goal,step:step>0?step:1,date:String(f.get('date')||today()),start:editId?get(editId).start:Number(f.get('start'))||0};if(editId){const i=state.trackers.findIndex(x=>x.id===editId);state.trackers[i]=t}else state.trackers.push(t);save();go('home');notify('Tracker saved')}else if(e.target.id==='ruleForm'){const f=new FormData(e.target),from=f.get('from'),to=f.get('to'),multiplier=Number(f.get('sign'))*Number(f.get('multiplier'));if(from===to)return alert('Choose two different trackers');if(state.rules.some(r=>r.from===to&&r.to===from))return alert('Opposite connections are not supported');if(!Number.isFinite(multiplier)||!multiplier)return;state.rules.push({id:id(),from,to,multiplier});save();render();notify('Connection added')}});app.addEventListener('click',e=>{const b=e.target.closest('[data-do],[data-filter]');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.do,i=b.dataset.id,t=get(i);if(a==='create'){page='create';render()}else if(a==='back')go('home');else if(a==='detail')showDetail(i);else if(a==='edit'){editId=i;page='create';render()}else if(a==='add')log(i,t.type==='habit'?1:Number(t.step)||1);else if(a==='subtract')log(i,t.type==='habit'?-1:-(Number(t.step)||1));else if(a==='custom'){const raw=prompt('Enter amount to add (use a negative number to subtract):','1');if(raw!==null&&raw.trim()!==''&&Number.isFinite(Number(raw)))log(i,Number(raw))}else if(a==='undo'){if(confirm('Delete this history entry?')){state.events=state.events.filter(x=>x.id!==i);save();render()}}else if(a==='deleteTracker'){if(confirm('Delete this tracker and all its history permanently?')){state.trackers=state.trackers.filter(x=>x.id!==i);state.events=state.events.filter(x=>x.trackerId!==i);state.rules=state.rules.filter(r=>r.from!==i&&r.to!==i);save();go('home')}}else if(a==='deleteRule'){state.rules=state.rules.filter(r=>r.id!==i);save();render()}else if(a==='export')exportData()});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
